[project]
name = "ai-hackathon"
version = "0.1.0"
description = "AI recipe workflow with RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "flask>=3.1.3",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.11",
    "mysql-connector-python>=26.7.0",
    "openai>=3.13.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "langchain>=1.4.3",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.3",
]
